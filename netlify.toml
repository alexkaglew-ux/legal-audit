[build]
  command = "npm run build"
  publish = "dist"

# alexkagianaris.com is the practice/personal site.
# Editorial publishing lives at sportslegalaudit.com.

[[redirects]]
  from = "/blog"
  to = "https://sportslegalaudit.com/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "https://sportslegalaudit.com/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/mlb-labor-war-cba-reopener-explained"
  to = "https://sportslegalaudit.com/latest/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/mlb-labor-war-cba-reopener-explained.html"
  to = "https://sportslegalaudit.com/latest/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://sportslegalaudit.com/latest/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/sports"
  to = "/sports/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
