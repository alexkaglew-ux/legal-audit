<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06141e"/><stop offset=".48" stop-color="#0c2130"/><stop offset="1" stop-color="#071722"/></linearGradient>
<radialGradient id="warm"><stop stop-color="#f0d3a1" stop-opacity=".72"/><stop offset=".18" stop-color="#c89d60" stop-opacity=".25"/><stop offset="1" stop-color="#c89d60" stop-opacity="0"/></radialGradient>
<filter id="b"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<!-- blurred warm soundstage -->
<circle cx="910" cy="130" r="170" fill="url(#warm)" filter="url(#b)"/><circle cx="1120" cy="250" r="130" fill="url(#warm)" filter="url(#b)" opacity=".55"/>
