<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04131d"/><stop offset=".55" stop-color="#0b2130"/><stop offset="1" stop-color="#071722"/></linearGradient>
<radialGradient id="lamp"><stop stop-color="#f1d5a5" stop-opacity=".62"/><stop offset=".2" stop-color="#d9b77d" stop-opacity=".28"/><stop offset="1" stop-color="#d9b77d" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<!-- warm practical studio lights -->
<g opacity=".9"><circle cx="875" cy="128" r="145" fill="url(#lamp)" filter="url(#soft)"/><circle cx="1085" cy="190" r="125" fill="url(#lamp)" filter="url(#soft)"/></g>
<!-- out of focus crew silhouettes -->
<g fill="#0a1218" opacity=".78"><circle cx="760" cy="315" r="38"/><rect x="724" y="350" width="75" height="210" rx="30"/><circle cx="1100" cy="330" r="34"/><rect x="1068" y="363" width="68" height="190" rx="28"/></g>
<!-- camera body and tripod, right background -->
<g fill="#071017" stroke="#53636c" stroke-width="5" opacity=".9"><rect x="895" y="205" width="185" height="112" rx="12"/><rect x="1068" y="226" width="72" height="70" rx="8"/><circle cx="1112" cy="261" r="34"/><rect x="930" y="174" width="64" height="32" rx="6"/><path d="M982 318v95M918 414h132M948 414 875 660M1020 414l92 246"/></g>
<!-- light stand -->
<g stroke="#8b806d" stroke-width="7" fill="#10171b"><path d="M820 175 760 655"/><rect x="758" y="82" width="128" height="92" rx="5" transform="rotate(-6 822 128)"/><path d="m770 92-58-45 30 103M875 91l72-38-54 102"/></g>
<!-- authentic director chair foreground -->
<g stroke="#bda984" stroke-width="8" fill="none"><path d="M455 330v300M675 330v300M455 445h220M480 630l170-185M650 630 480 445"/><rect x="438" y="280" width="255" height="120" rx="4" fill="#08151e" stroke="#8f7a59"/><path d="M478 488h172"/></g>
<text x="566" y="352" text-anchor="middle" fill="#d4b780" font-family="Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="6">DIRECTOR</text>
<!-- cinematic vignette -->
<rect width="1200" height="700" fill="none" stroke="#01070b" stroke-width="100" opacity=".38"/>
</svg>